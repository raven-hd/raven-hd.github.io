# проверка версии 118 внутри общего репозитория raven-hd.github.io.
# запускается при загрузке в тестовую ветку. публикации сайта и доступа к рабочей БД нет.
name: fruitkog 118 test

on:
  push:
    branches: [fruitkog-118-test, fruitkog-rewards]
    paths:
      - 'fruitkog-battle/**'
      - '.github/workflows/fruitkog-118-test.yml'

permissions:
  contents: read

concurrency:
  group: fruitkog-118-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: fruitkog-battle

jobs:
  checks:
    name: code and database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: fruitkog-battle

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: check modules
        run: python3 scripts/check_modules.py

      - name: check JavaScript
        run: npx --yes eslint@10.11.0 .

      - name: check error messages
        run: python3 scripts/check_error_keys.py

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.118.0

      - name: start temporary local database
        run: supabase db start

      - name: database tests
        run: supabase test db

  e2e:
    name: browser game and tournament
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: fruitkog-battle

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.118.0

      - name: start temporary local Supabase
        run: supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: install test browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: browser scenario
        run: node tests/e2e/run.cjs

      - name: save scenario journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fruitkog-e2e-journal
          path: fruitkog-battle/tests/e2e/out/
          if-no-files-found: ignore
          retention-days: 7
