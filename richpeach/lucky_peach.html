            background-repeat: repeat, repeat, repeat;
            background-size: 156px 512px, auto, auto;
            color: var(--text-color);
            font-family: "Times New Roman", Times, serif, Georgia;
            line-height: 1.5;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .workshop-container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 60px 20px;
        }

        /* Шапка-вывеска: тёмная деревянная панель во всю ширину с резным лого и заклёпками */
        .hero-header {
            width: 100%;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            background-color: #16281f;
            background-image: url('https://raw.githubusercontent.com/raven-hd/raven-hd.github.io/refs/heads/main/richpeach/bead/plashka.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-bottom: 6px solid #0c1712;
            box-shadow: 0 10px 22px rgba(0,0,0,0.55), inset 0 2px 3px rgba(255,255,255,0.06);
        }

        .logo-img {
            width: 280px;
            max-width: 65%;
            height: auto;
            position: relative;
            z-index: 2;
        }

        .sign-rivet {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #a3805c 0%, #6b4a30 45%, #33210f 100%);
            box-shadow: 0 2px 3px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.35);
            flex-shrink: 0;
        }

        .sign-rivet-left { margin-right: 40px; }
        .sign-rivet-right { margin-left: 40px; }

        @media (max-width: 600px) {
            .sign-rivet-left { margin-right: 20px; }
            .sign-rivet-right { margin-left: 20px; }
        }

        section {
            width: 100%;
            margin-bottom: 24px;
            text-align: center;
        }

        h3 {
            margin: 0 0 16px 0;
            font-size: 0.68rem;
            font-weight: normal;
            letter-spacing: 1.5px;
            color: #7d715a;
            text-transform: uppercase;
        }

        .line-heading {
            display: flex;
            align-items: center;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #C5A059;
        }

        .line-heading::before,
        .line-heading::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, #C5A059);
        }

        .line-heading::after {
            background: linear-gradient(to left, transparent, #C5A059);
        }

        .line-heading span {
            padding: 0 15px;
            white-space: nowrap;
        }

        /* Шаг 1: Палитра в один ряд с разным наклоном карточек */
        .palette-grid {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 12px;
            max-width: 100%;
            overflow-x: auto;
            padding: 15px 5px;
        }

        .palette-item {
            background: var(--paper-bg);
            color: var(--paper-text);
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #D1C2AD;
            box-shadow: 0 3px 6px rgba(0,0,0,0.22);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 85px;
            flex-shrink: 0;
        }

        /* Индивидуальный наклон для карточек в один ряд */
        .palette-item:nth-child(1) { transform: rotate(-3deg); }
        .palette-item:nth-child(2) { transform: rotate(2deg); }
        .palette-item:nth-child(3) { transform: rotate(-1.5deg); }
        .palette-item:nth-child(4) { transform: rotate(3.5deg); }
        .palette-item:nth-child(5) { transform: rotate(-2deg); }
        .palette-item:nth-child(6) { transform: rotate(1deg); }
        .palette-item:nth-child(7) { transform: rotate(-3deg); }
        .palette-item:nth-child(8) { transform: rotate(2.5deg); }
        .palette-item:nth-child(9) { transform: rotate(-1deg); }

        .palette-item::before {
            content: '';
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #a3805c 0%, #6b4a30 45%, #33210f 100%);
            box-shadow: 0 2px 3px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.35);
            z-index: 2;
        }

        .palette-item:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            z-index: 2;
        }

        .palette-item.selected {
            z-index: 3;
        }

        .color-sample {
            width: 34px;
            height: 40px;
            position: relative;
            z-index: 1;
            filter: saturate(0.8) brightness(0.95) contrast(0.92);
            opacity: 0.92;
        }

        .color-sample svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .palette-name {
            font-size: 0.75rem;
            font-weight: bold;
        }

        .palette-check {
            width: 13px;
            height: 13px;
            border: 1.5px solid #8a7548;
            border-radius: 50%;
            position: relative;
            z-index: 1;
        }

        .palette-item.selected .palette-check::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 0px;
            width: 4px;
            height: 7px;
            border: solid var(--accent-burgundy);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Столешница: мешочки стоят прямо на ней, без ручных сдвигов */
        .countertop-wrapper {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            position: relative;
        }

        .bags-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 60px;
            flex-wrap: wrap;
            position: relative;
            z-index: 4;
            width: 100%;
            padding: 0 20px;
            margin-bottom: -47px; /* мешочки пересекают полку */
        }

        .countertop-surface {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 14px rgba(0,0,0,0.55));
        }

        .bag-card {
            background: transparent;
            border: none;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .bag-card.selected {
            /* без анимации */
        }

        .bag-img {
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 18px 14px rgba(0,0,0,0.75)) drop-shadow(0 6px 5px rgba(0,0,0,0.5));
        }

        .bag-card.selected::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 10px;
            background: rgba(197, 160, 89, 0.4);
            border-radius: 50%;
            filter: blur(4px);
            z-index: -1;
        }

        /* Результат */
        .result-section {
            width: 100%;
            padding-top: 8px;
            text-align: center;
            margin-top: 24px;
        }

        #step-bags {
            margin-bottom: 20px;
        }

        .beads-drop-area {
            position: relative;
            margin: 20px auto;
            width: 100%;
            max-width: 600px;
            min-height: 140px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(197,160,89,0.3);
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .bead-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fallIn 0.5s ease forwards;
            opacity: 0;
            transform: translateY(-35px) scale(0.8) rotate(0deg);
        }

        @keyframes fallIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(var(--rot));
            }
        }

        .bead-item img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
        }

        .order-btn {
            display: inline-block;
            background-color: var(--accent-burgundy);
            color: #FFF;
            border: 1px solid #552528;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            text-transform: uppercase;
        }

        .order-btn:hover {
            background-color: #A85A58;
        }

        .order-btn.disabled {
            background-color: #3B4A45;
            color: #888;
            border-color: #2C3834;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }
    </style>
</head>

            item.addEventListener('click', () => {
                document.querySelectorAll('.palette-item').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                selectedPalette = p.name;
                
                document.getElementById('resPalette').textContent = selectedPalette;

                updateOrderLink();
            });
            paletteGrid.appendChild(item);
        });

        // Свободный выбор мешочка
        const bagCards = document.querySelectorAll('.bag-card');
        bagCards.forEach(card => {
            card.addEventListener('click', () => {
                bagCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');

                const sizeName = card.getAttribute('data-size');
                const count = parseInt(card.getAttribute('data-count'));

                selectedBagData = { size: sizeName, count: count };
                document.getElementById('resSize').textContent = selectedBagData.size;

                generateBeads(selectedBagData.count);
            });
        });

        function generateBeads(count) {
            drawnBeads = [];
            for (let i = 0; i < count; i++) {
                const beadNum = Math.floor(Math.random() * CONFIG.totalBeads) + 1;
                drawnBeads.push(beadNum);
            }
            showResults();
        }

        function showResults() {
            const dropArea = document.getElementById('beadsDropArea');
            dropArea.innerHTML = '';

            const areaWidth = dropArea.clientWidth || 550;
            const areaHeight = 140;
            const itemSize = 44;
            const positions = [];

            for (let i = 0; i < drawnBeads.length; i++) {
                let posX, posY, attempts = 0;
                let overlap = true;

                while (overlap && attempts < 50) {
                    attempts++;
                    posX = Math.floor(Math.random() * (areaWidth - itemSize - 40)) + 20;
                    posY = Math.floor(Math.random() * (areaHeight - itemSize - 30)) + 15;

                    overlap = false;
                    for (let pos of positions) {
                        const dist = Math.hypot(pos.x - posX, pos.y - posY);
                        if (dist < itemSize * 0.85) {
                            overlap = true;
                            break;
                        }
                    }
                }
                positions.push({ x: posX, y: posY });
            }

            drawnBeads.forEach((beadNum, index) => {
                setTimeout(() => {
                    const formattedNum = String(beadNum).padStart(2, '0');
                    const fileName = `peach${formattedNum}.png`;
                    const randomRot = (Math.random() * 60 - 30).toFixed(1) + 'deg';

                    const beadEl = document.createElement('div');
                    beadEl.className = 'bead-item';
                    beadEl.style.setProperty('--rot', randomRot);
                    beadEl.style.left = positions[index].x + 'px';
                    beadEl.style.top = positions[index].y + 'px';
                    
                    const imgUrl = `https://raw.githubusercontent.com/raven-hd/raven-hd.github.io/refs/heads/main/richpeach/bead/${fileName}`;
                    
                    beadEl.innerHTML = `
                        <img src="${imgUrl}" alt="Бусина">
                    `;
                    
                    dropArea.appendChild(beadEl);

                    if (index === drawnBeads.length - 1) {
                        updateOrderLink();
                    }
                }, index * 150);
            });
        }

        // Формирование ссылки на оплату/заказ
        function updateOrderLink() {
            const link = document.getElementById('orderBtn');

            if (!selectedPalette || !selectedBagData || drawnBeads.length === 0) {
                link.classList.add('disabled');
                link.href = '#';
                return;
            }

            const amount = CONFIG.bagPrices[selectedBagData.size];

            const codes = drawnBeads.map(num => `peach${String(num).padStart(2, '0')}`);
            const comment = `${codes.join(', ')} + ${selectedPalette}`;

            const url = `https://hogsmeade.dhog.org/ucp.php?i=-hogsmeade-bank-ucp-main_module&mode=personal_transactions&amount=${amount}&to=${CONFIG.sellerId}&comment=${encodeURIComponent(comment)}`;

            link.href = url;
            link.classList.remove('disabled');
        }
