<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RavenFM — сейчас играет</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      text-align: right;
    }

    .now {
      width: 100%;
      box-sizing: border-box;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.2;
    }

    .label {
      color: rgba(221, 201, 170, .42);
      font-size: 11px;
      letter-spacing: .015em;
    }

    .track {
      color: #e6cfaa;
      font-size: 12px;
      letter-spacing: .012em;
    }
  </style>
</head>
<body>
  <div class="now">
    <span class="label">сейчас играет · </span><span class="track" id="track">Raven.FM в эфире</span>
  </div>

  <script>
    const endpoint = "https://radio.dhog.org/api/nowplaying_static/raven.txt";
    const track = document.getElementById("track");

    async function updateTrack() {
      try {
        const response = await fetch(endpoint, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);

        const text = (await response.text()).trim();
        track.textContent = text || "Raven.FM в эфире";
      } catch (error) {
        track.textContent = "Raven.FM в эфире";
      }
    }

    updateTrack();
    setInterval(updateTrack, 30000);
  </script>
</body>
</html>
