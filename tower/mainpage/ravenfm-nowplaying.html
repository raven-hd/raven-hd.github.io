<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #d7a85d;
      line-height: 1.1;
    }

    .track {
      display: block;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 20px;
      color: #d7a85d;
    }
  </style>
</head>
<body>
  <div class="track" id="track">...</div>

  <script>
    fetch('https://radio.dhog.org/api/nowplaying/raven', { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        const title =
          data?.now_playing?.song?.title ||
          data?.now_playing?.song?.text ||
          '—';

        document.getElementById('track').textContent = title;
      })
      .catch(() => {
        document.getElementById('track').textContent = '—';
      });
  </script>
</body>
</html>
