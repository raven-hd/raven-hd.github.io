<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RavenFM — сейчас играет</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;

      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: romul, Georgia, "Times New Roman", serif;
      text-align: right;
    }

    #track {
      display: block;

      width: 100%;
      height: 16px;

      color: #c99a5a;

      font-size: 12px;
      font-weight: 400;
      line-height: 16px;

      letter-spacing: .02em;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <span id="track">Raven.FM в эфире</span>

  <script>
    const endpoint =
      "https://radio.dhog.org/api/nowplaying_static/raven.txt";

    const track = document.getElementById("track");

    async function updateTrack() {
      try {
        const response = await fetch(endpoint, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const text = (await response.text()).trim();

        track.textContent =
          text || "Raven.FM в эфире";
      } catch (error) {
        track.textContent = "Raven.FM в эфире";
      }
    }

    updateTrack();
    setInterval(updateTrack, 30000);
  </script>
</body>
</html>
