<div class="raven-mobile-tabs" aria-label="Разделы Когтеврана">

  <input
    class="raven-mobile-tab-input"
    type="checkbox"
    id="raven-tab-newbirds">

  <input
    class="raven-mobile-tab-input"
    type="checkbox"
    id="raven-tab-honors">

  <input
    class="raven-mobile-tab-input"
    type="checkbox"
    id="raven-tab-cup">

  <input
    class="raven-mobile-tab-input"
    type="checkbox"
    id="raven-tab-wave">

  <input
    class="raven-mobile-tab-input"
    type="checkbox"
    id="raven-tab-litclub">

  <input
    class="raven-mobile-tab-input"
    type="checkbox"
    id="raven-tab-events">


  <!-- Каждый overlay закрывает только свою открытую панель -->

  <label
    class="raven-mobile-overlay-close raven-close-newbirds"
    for="raven-tab-newbirds"
    aria-label="Закрыть панель">
  </label>

  <label
    class="raven-mobile-overlay-close raven-close-honors"
    for="raven-tab-honors"
    aria-label="Закрыть панель">
  </label>

  <label
    class="raven-mobile-overlay-close raven-close-cup"
    for="raven-tab-cup"
    aria-label="Закрыть панель">
  </label>

  <label
    class="raven-mobile-overlay-close raven-close-wave"
    for="raven-tab-wave"
    aria-label="Закрыть панель">
  </label>

  <label
    class="raven-mobile-overlay-close raven-close-litclub"
    for="raven-tab-litclub"
    aria-label="Закрыть панель">
  </label>

  <label
    class="raven-mobile-overlay-close raven-close-events"
    for="raven-tab-events"
    aria-label="Закрыть панель">
  </label>


  <div class="raven-mobile-tabbar raven-mobile-tabbar-left">

    <label
      class="raven-mobile-tab"
      for="raven-tab-newbirds"
      title="Новые птицы"
      aria-label="Новые птицы">
      <i class="fa-solid fa-feather"></i>
    </label>

    <label
      class="raven-mobile-tab"
      for="raven-tab-honors"
      title="Доска почета"
      aria-label="Доска почета">
      <i class="fa-solid fa-award"></i>
    </label>

    <label
      class="raven-mobile-tab"
      for="raven-tab-cup"
      title="Кубок школы"
      aria-label="Кубок школы">
      <i class="fa-solid fa-trophy"></i>
    </label>

  </div>


  <div class="raven-mobile-tabbar raven-mobile-tabbar-right">

    <label
      class="raven-mobile-tab"
      for="raven-tab-wave"
      title="Когтевранская волна"
      aria-label="Когтевранская волна">
      <i class="fa-solid fa-radio"></i>
    </label>

    <label
      class="raven-mobile-tab"
      for="raven-tab-litclub"
      title="Литературный клуб"
      aria-label="Литературный клуб">
      <i class="fa-solid fa-book-open"></i>
    </label>

    <label
      class="raven-mobile-tab"
      for="raven-tab-events"
      title="Ближайшие события"
      aria-label="Ближайшие события">
      <i class="fa-solid fa-calendar-days"></i>
    </label>

  </div>

</div>
