<style>
:root{
  --navy:#15304f;--navy2:#0f2742;--ink:#21304a;--paper:#ead9bd;--paper2:#f2e6d0;--cream:#f5ead7;
  --wood:#4b2f1f;--wood2:#2f1d13;--chalk:#f4f1e8;--muted:#715e4c;--line:#b89e7b;--success:#315f3b;--danger:#8a4a33;
  font-family:Georgia,"Times New Roman",serif;color:#2b241e;background:#1d2b26;
}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#182a25,#17231f);color:#2b241e}button,input{font:inherit}
.hidden{display:none!important}.loading{opacity:.58;pointer-events:none}.error{color:#8f2f25;font:600 14px/1.35 Arial,sans-serif;margin-top:8px}
.site-shell{min-height:100vh}.topbar{height:62px;background:linear-gradient(180deg,#18375a,#0e2948);color:#ead9bd;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:2px solid #a17d4f;box-shadow:0 3px 10px #0007;position:relative;z-index:20}
.brand{font-weight:900;letter-spacing:.055em;font-size:21px;text-transform:uppercase}.brand small{font:400 12px/1 Arial,sans-serif;opacity:.82;margin-left:10px;letter-spacing:.02em;text-transform:none}
.nav-actions{display:flex;gap:8px}.nav-btn{border:1px solid #d7c29e66;background:#102b49;color:#f0dfbe;padding:9px 13px;border-radius:5px;cursor:pointer}.nav-btn:hover{background:#1d426a}
.notice{max-width:980px;margin:18px auto;background:#fff5ce;border:1px solid #d7bc68;border-radius:8px;padding:12px 14px;font:14px Arial,sans-serif}

.hero-inner{max-width:1180px;margin:auto;position:relative;min-height:610px;padding:28px 24px}.wood-title{position:absolute;left:28px;top:24px;width:min(520px,45vw);background:linear-gradient(180deg,#203b5c,#142e4d);border:5px solid #312015;border-radius:5px;padding:16px 22px;color:#efe2c7;box-shadow:0 8px 20px #0008,inset 0 0 0 2px #876640;text-shadow:0 2px #0008;transform:rotate(-.4deg)}
.wood-title h1{font-size:37px;line-height:1.02;margin:0;text-transform:uppercase;letter-spacing:.03em}.wood-title p{margin:8px 0 0;font:17px/1.35 "Comic Sans MS",cursive;color:#e7d3ad}
.hero-grid{position:absolute;left:35px;right:35px;bottom:32px;display:grid;grid-template-columns:1fr 1.18fr;gap:34px;align-items:end}.chalkboard{background:#1f2422;border:12px solid #49301f;outline:2px solid #1e130c;border-radius:3px;min-height:285px;padding:28px;text-align:center;color:var(--chalk);box-shadow:0 12px 24px #0008,inset 0 0 35px #0008;transform:rotate(-.5deg)}
.chalkboard .label{font:25px/1.2 "Comic Sans MS",cursive;opacity:.92}.chalk-number{font:900 105px/1 Arial,sans-serif;letter-spacing:-.05em;margin:10px 0 0;color:#f3efe4;text-shadow:2px 2px #000}.chalkboard .unit{font:33px/1.1 "Comic Sans MS",cursive}.chalk-doodle{font-size:36px;margin-top:8px}
.badge-wrap{display:grid;gap:14px;justify-items:center}.badge{width:min(580px,100%);background:linear-gradient(135deg,#d9cbb2,#eee2c9 58%,#cbb99a);border:2px solid #9c886b;border-radius:16px;padding:0 0 16px;box-shadow:0 12px 20px #0007;position:relative}.clip{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:55px;height:58px;border:8px solid #5e5b53;border-bottom:0;border-radius:25px 25px 6px 6px;background:#76756d;box-shadow:0 4px 5px #0007}.badge-head{background:var(--navy);color:#f5e3bf;padding:16px 20px;text-align:center;font-weight:900;text-transform:uppercase;letter-spacing:.07em;border-radius:14px 14px 0 0;font-size:22px}.badge-body{padding:17px 22px 0}.badge-body label{display:block;font:700 15px Arial,sans-serif;color:#41506a;margin-bottom:6px}.badge-input{width:100%;background:#f7edda;border:0;border-bottom:2px solid #a88e67;padding:11px 12px;font:25px/1.2 "Comic Sans MS",cursive;color:#213b60;text-align:center;outline:none}.badge-note{font:12px/1.35 Arial,sans-serif;color:#66594d;text-align:center;margin:9px 0 0}.enter-btn{width:min(520px,90%);background:linear-gradient(#1e4269,#102c4b);color:#f2dfbb;border:3px solid #0b2139;box-shadow:0 5px 0 #081a2d,0 9px 14px #0005;padding:14px 24px;border-radius:5px;font-weight:900;font-size:21px;text-transform:uppercase;cursor:pointer;letter-spacing:.035em}.enter-btn:hover{transform:translateY(-1px)}
.leader-zone{background:linear-gradient(#4e321f,#2f1e14);padding:36px 18px 65px;min-height:390px}.paper{max-width:1030px;margin:0 auto;background:#e8d4ae;background-image:linear-gradient(#53719b22 1px,transparent 1px),linear-gradient(90deg,#53719b18 1px,transparent 1px);background-size:100% 30px,30px 100%;border:1px solid #b29468;padding:28px 34px 34px;box-shadow:0 9px 18px #0007;transform:rotate(.15deg);position:relative}.paper:before,.paper:after{content:"";position:absolute;width:82px;height:28px;background:#d2b37c99;top:-12px}.paper:before{left:40px;transform:rotate(-5deg)}.paper:after{right:40px;transform:rotate(6deg)}
.paper-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:15px}.paper h2{margin:0;color:#153b69;font:900 30px/1.1 "Comic Sans MS",cursive}.refresh{border:0;background:#173b62;color:#f1dfbf;border-radius:4px;padding:9px 14px;cursor:pointer}.leaderboard{width:100%;border-collapse:collapse;font:19px/1.25 "Comic Sans MS",cursive;color:#173b62}.leaderboard th{background:#244d77;color:#f3dfbd;text-align:left;padding:8px 10px;font:700 14px Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em}.leaderboard td{padding:10px;border-bottom:1px solid #9b7e5a88}.leaderboard tr:first-child td:first-child{font-weight:900}.landing-footer{text-align:center;color:#e6ceb0;font:14px Arial,sans-serif;margin-top:22px;opacity:.8}

/* KITCHEN */
.kitchen{min-height:calc(100vh - 62px);background:radial-gradient(circle at 50% 0,#54718a 0,#29435e 25%,#1c2e3f 56%,#121d28 100%);padding:26px 16px 55px}.kitchen-board{max-width:1180px;margin:auto;background:#4b301f;border:8px solid #2f1d13;box-shadow:0 12px 25px #0008;padding:24px;border-radius:4px;background-image:linear-gradient(90deg,#ffffff08,#0000 40%,#0003)}
.kitchen-head{display:flex;align-items:center;justify-content:space-between;gap:14px;color:#f1dfbd;margin-bottom:20px}.kitchen-head h1{margin:0;font-size:30px;letter-spacing:.03em}.cook-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cook-name{background:#e8d7b7;color:#193c63;border:2px solid #ad9069;padding:8px 13px;border-radius:4px;font-family:"Comic Sans MS",cursive}.tiny-btn{border:1px solid #c4a97c;background:#153b63;color:#f0dfbd;padding:9px 12px;border-radius:4px;cursor:pointer}

function toggle(type,item){if(type==='main')state.main=state.main===item?null:item;if(type==='spice')state.spice=state.spice===item?null:item;if(type==='add'){const i=state.adds.indexOf(item);if(i>=0)state.adds.splice(i,1);else if(state.adds.length<2)state.adds.push(item)}renderGame()}

async function ensureAnonSession(){let {data:{session}}=await sb.auth.getSession();if(session)return session.user;const {data,error}=await sb.auth.signInAnonymously();if(error)throw error;return data.user}

async function loadPlayerStats(){
  const {data,error}=await sb
    .from('attempts')
    .select('success,recipe_key,main_ingredient,add_1,add_2,spice,created_at')
    .eq('user_id',currentUser.id)
    .order('created_at',{ascending:true});

  if(error)throw error;

  state.found=new Set();
  state.foundDetails=new Map();

  data
    .filter(x=>x.success&&x.recipe_key)
    .forEach(x=>{
      const name=KEY_TO_NAME[x.recipe_key];
      if(!name)return;
      state.found.add(name);

      /* Сохраняем первый реально приготовленный игроком вариант этого блюда. */
      if(!state.foundDetails.has(name)){
        state.foundDetails.set(name,{
          main:x.main_ingredient||'',
          adds:[x.add_1,x.add_2].filter(Boolean),
          spice:x.spice||''
        });
      }
    });

  renderMyDishes();
}
async function loadLeaderboard(){const body=$('leaderboardBody');body.innerHTML='<tr><td colspan="4">Загрузка…</td></tr>';const {data,error}=await sb.rpc('get_leaderboard');if(error){console.error(error);body.innerHTML='<tr><td colspan="4">Не удалось загрузить рейтинг.</td></tr>';$('totalCasseroles').textContent='—';return}const total=data.reduce((sum,p)=>sum+Number(p.casseroles||0),0);$('totalCasseroles').textContent=total;if(!data.length){body.innerHTML='<tr><td colspan="4">Пока никто ничего не приготовил.</td></tr>';return}body.innerHTML='';data.forEach(p=>{const tr=document.createElement('tr');[p.place,p.display_name,p.casseroles,p.unique_recipes].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});body.appendChild(tr)})}
function renderMyDishes(){
  const box=$('myDishes');
  box.innerHTML='';
  const names=[...state.found];

  if(!names.length){
    box.innerHTML='<div class="empty-dishes">Пока здесь пусто. Тажин требует экспериментов.</div>';
    return;
  }

  names.sort((a,b)=>a.localeCompare(b,'ru')).forEach(name=>{
    const details=state.foundDetails.get(name)||{main:'',adds:[],spice:''};

    const card=document.createElement('article');
    card.className='dish-card';

    const img=document.createElement('img');
    img.className='dish-card-image';
    img.src=dishImageUrl(name);
    img.alt=name;
    img.loading='lazy';

    const title=document.createElement('div');
    title.className='dish-card-title';
    title.textContent=name;

    const ingredients=document.createElement('div');
    ingredients.className='dish-card-ingredients';

    const parts=[details.main,...details.adds].filter(Boolean);
    const base=document.createElement('div');
    base.textContent=parts.join(' · ');
    ingredients.appendChild(base);

    if(details.spice){
      const spice=document.createElement('div');
      spice.className='dish-card-spice';
      spice.textContent='+ '+details.spice;
      ingredients.appendChild(spice);
    }

    card.append(img,title,ingredients);
    box.appendChild(card);
  });
}

'Творожная':'Творожная.png',
'Творожно-яблочная':'Творожно-яблочная.png',
'Тыквенная':'Тыквенная.png',
'Тыквенно-творожная':'Тыквенно-творожная.png',
'Тыквенно-яблочная':'Тыквенно-яблочная.png'
};
const DISH_IMAGE_BASE='https://raw.githubusercontent.com/raven-hd/raven-hd.github.io/refs/heads/main/zapekanochnik/food/';
function dishImageUrl(dish){
  const file=DISH_IMAGE_FILES[dish];
  return file ? DISH_IMAGE_BASE+encodeURIComponent(file).replace(/%2F/g,'/') : '';
}

const SPICE_REACTIONS={
  'карри':'Карри? Интересный выбор!',
  'базилик':'Базилик? Приятное сочетание.',
  'чеснок':'Чеснок? Смело — и довольно аппетитно.',
  'паприка':'Паприка? Будет поярче.',
  'корица':'Корица? Пахнет экспериментом.',
  'орегано':'Орегано? Почти по-итальянски.',
  'ваниль':'Ваниль? Очень нежный ход.',
  'мускатный орех':'Мускатный орех? Благородно.',
  'тимьян':'Тимьян? Хорошая мысль.',
  'розмарин':'Розмарин? Звучит убедительно.'
};
function spiceReaction(spice){
  return SPICE_REACTIONS[spice] || `${spice}? Любопытный выбор.`;
}

function showCookResult(dish){
  const title=$('cookResultTitle'),visual=$('cookResultVisual'),note=$('cookResultNote');
  if(dish){
    title.textContent=dish;
    const url=dishImageUrl(dish);
    visual.innerHTML=`<img class="cook-result-image" src="${url}" alt="${escapeHtml(dish)}">`;
    const recommended=RECOMMENDED[dish];
    if(state.spice&&state.spice!==recommended){
      note.textContent=spiceReaction(state.spice);
    }else if(state.spice&&state.spice===recommended){
      note.textContent='И специя на месте. Подозрительно профессионально.';
    }else{
      note.textContent='Запеканка готова!';
    }
  }else{
    title.textContent='Жижа';
    visual.innerHTML='<img class="cook-result-image" src="https://raw.githubusercontent.com/raven-hd/raven-hd.github.io/refs/heads/main/zapekanochnik/food/%D0%96%D0%B8%D0%B6%D0%B0.png" alt="Жижа">';
    note.textContent='Что-то пошло не так. Получилась жижа.';
  }
  $('cookResultModal').classList.remove('hidden');
}
function closeCookResult(){
  $('cookResultModal').classList.add('hidden');
  resetSelection();
}

async function saveAttempt({success,dish=null}){const payload={user_id:currentUser.id,success,recipe_key:success?DISH_KEYS[dish]:null,result_name:success?dish:'Жижа',main_ingredient:state.main,add_1:state.adds[0],add_2:state.adds[1],spice:state.spice||null};const {error}=await sb.from('attempts').insert(payload);if(error)throw error}
async function cook(){
  if(!(state.main && state.adds.length===2)) return;

  $('saveError').textContent='';
  const matches=findDish(state.main,state.adds);

  if(matches.length>1){
    $('saveError').textContent='Ошибка базы рецептов: найден конфликт.';
    console.error('КОНФЛИКТ',matches);
    return;
  }

  setLoading(true);

  try{
    const dish=matches.length===1 ? matches[0] : null;

    await saveAttempt({
      success: !!dish,
      dish
    });

    /* Обновляем коллекцию сразу после успешной готовки */
    await loadPlayerStats();

    /* НИКУДА НЕ ПЕРЕКЛЮЧАЕМ СТРАНИЦУ.
       Кухня остаётся видимой под модальным окном. */
    showCookResult(dish);

  }catch(err){
    console.error(err);
    $('saveError').textContent=
      'Не удалось сохранить попытку в базе. Проверьте подключение Supabase.';
  }finally{
    setLoading(false);
  }
}


document.querySelectorAll('.ingredient-hotspot').forEach(b=>{
  b.addEventListener('click',e=>{
    if(b.classList.contains('info-only')){
      e.preventDefault();
      return;
    }
    toggle(b.dataset.type,b.dataset.item);
  });
});

$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const displayName=$('playerName').value.trim();if(displayName.length<2){$('loginError').textContent='Введите имя участника.';return}$('loginBtn').disabled=true;try{if(!currentUser)currentUser=await ensureAnonSession();const {data:profile,error}=await sb.from('profiles').upsert({user_id:currentUser.id,display_name:displayName},{onConflict:'user_id'}).select('user_id,display_name').single();if(error)throw error;currentProfile=profile;$('forgetBtn').classList.remove('hidden');await showKitchen()}catch(err){console.error(err);$('loginError').textContent='Не удалось войти. Проверьте настройки Supabase.'}finally{$('loginBtn').disabled=false}})
$('forgetBtn').addEventListener('click',async()=>{if(!confirm('Сменить дежурного на этом устройстве? Статистика в базе не удалится.'))return;await sb.auth.signOut();location.reload()});
$('cookBtn').addEventListener('click',cook);
$('closeCookResultBtn').addEventListener('click',closeCookResult);
$('cookResultModal').addEventListener('click',e=>{if(e.target===$('cookResultModal'))closeCookResult()});$('refreshLeaderboardBtn').addEventListener('click',loadLeaderboard);$('homeBtn').addEventListener('click',showLanding);$('homeTopBtn').addEventListener('click',showLanding);$('dishesBtn').addEventListener('click',openDishes);$('dishesTopBtn').addEventListener('click',openDishes);$('closeDishesBtn').addEventListener('click',closeDishes);$('dishesModal').addEventListener('click',e=>{if(e.target===$('dishesModal'))closeDishes()});

async function init(){renderGame();if(!configured){$('configNotice').classList.remove('hidden');$('landing').classList.remove('hidden');$('loginBtn').disabled=true;return}try{currentUser=await ensureAnonSession();await loadProfile();await loadPlayerStats();await loadLeaderboard();$('landing').classList.remove('hidden')}catch(err){console.error(err);$('configNotice').textContent='Не удалось подключиться к Supabase. Проверьте Project URL и Publishable key.';$('configNotice').classList.remove('hidden');$('landing').classList.remove('hidden')}}
init();

/* Табличка на кухне → обратно на экран авторизации/рейтинга */
const kitchenLogo = document.querySelector('#game img[src*="log_tazjin.png"]');
if(kitchenLogo){
  kitchenLogo.setAttribute('role','button');
  kitchenLogo.setAttribute('tabindex','0');
  kitchenLogo.setAttribute('aria-label','Вернуться на главную');

  const backToLanding = ()=>{
    $('game').classList.add('hidden');
    $('landing').classList.remove('hidden');
    window.scrollTo({top:0, behavior:'smooth'});
    loadLeaderboard();
  };

  kitchenLogo.addEventListener('click', backToLanding);
  kitchenLogo.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){
      e.preventDefault();
      backToLanding();
    }
  });
}

</script>
